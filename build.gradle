plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

loom {
    runs {
        preview {
            server()
            name = "City Preview Render"
            vmArg "-Dbrutalicious.preview=${rootProject.file('run/preview').absolutePath}"
            runDir "run"
        }
    }
}

tasks.register('renderPreview', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'brutalicious.debug.PreviewMain'
    args file('run/preview').absolutePath, (project.findProperty('seed') ?: 'brutalist')
    jvmArgs '-Xmx4G', '-Djava.awt.headless=true'
    if (project.findProperty('probe')) systemProperty 'brutalicious.probe', project.findProperty('probe')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java { withSourcesJar() }

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
